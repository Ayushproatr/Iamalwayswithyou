<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Didu 💛</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:sans-serif;
overflow:hidden;
background:linear-gradient(135deg,#fbeaff,#e6f0ff);
}

/* slides */
.slide{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
transition:0.6s;
}
.hidden{opacity:0;pointer-events:none}

/* buttons */
button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#caa6ff;
color:white;
margin:8px;
}

/* breathing */
.breath{
width:100px;height:100px;
border-radius:50%;
background:#caa6ff;
animation:breathe 5s infinite;
}
@keyframes breathe{
0%{transform:scale(1)}
50%{transform:scale(1.6)}
100%{transform:scale(1)}
}

/* blur */
.blur-bg{filter:blur(6px) brightness(0.7)}

/* overlay */
#focusOverlay{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.3);
color:white;
z-index:999;
}
#focusOverlay.active{display:flex}

/* chat */
#chatBox{
width:100%;max-width:360px;height:60vh;
background:white;
border-radius:20px;
padding:10px;
overflow:auto;
display:flex;
flex-direction:column;
gap:8px;
}
.msg{padding:10px;border-radius:12px;max-width:75%}
.me{background:#caa6ff;color:white;align-self:flex-end}
.her{background:#eee}

/* hearts */
.heart{
position:absolute;
font-size:20px;
animation:float 6s linear infinite;
}
@keyframes float{
0%{transform:translateY(100vh)}
100%{transform:translateY(-10vh)}
}
</style>
</head>

<body>

<audio id="voice" preload="auto">
<source src="ayush.mp3" type="audio/mpeg">
</audio>

<div id="focusOverlay">Just listen… 🤍</div>

<!-- S1 -->
<div id="s1" class="slide">
<h2>Hey Didu 💛</h2>
<button onclick="next(1)">Start</button>
</div>

<!-- S2 -->
<div id="s2" class="slide hidden">
<div class="breath"></div>
<p>Breathe slowly 🤍</p>
<button onclick="next(2)">Next</button>
</div>

<!-- S3 -->
<div id="s3" class="slide hidden">
<p>I’m here 🤍</p>
<button onclick="playVoice()">Hear me 🎧</button>
<button onclick="next(3)">Next</button>
</div>

<!-- CHAT -->
<div id="chat" class="slide hidden">
<div id="chatBox"></div>
<button onclick="goGame()">Next</button>
</div>

<!-- GAME -->
<div id="game" class="slide hidden">
<h2>Tap 🤍</h2>
<p id="score">0</p>
</div>

<script>
function next(n){
document.getElementById("s"+n).classList.add("hidden");
if(n==3){
chat.classList.remove("hidden");
startChat();
}else{
document.getElementById("s"+(n+1)).classList.remove("hidden");
}
}

/* 🔥 FIXED AUDIO */
function playVoice(){
let audio=document.getElementById("voice");

audio.pause();
audio.currentTime=0;

let p=audio.play();
if(p!==undefined){
p.catch(()=>alert("Tap again to play 🎧"));
}

document.body.classList.add("blur-bg");
focusOverlay.classList.add("active");

audio.onended=()=>{
document.body.classList.remove("blur-bg");
focusOverlay.classList.remove("active");
};
}

/* chat */
let flow=[
["Hey didu 🤍","me"],
["Feeling overwhelmed?","me","opt"]
];
let i=0;

function typing(cb){
let t=document.createElement("div");
t.className="msg her";
t.innerText="typing...";
chatBox.appendChild(t);
setTimeout(()=>{t.remove();cb()},1000);
}

function startChat(){step()}
function step(){
if(i>=flow.length)return;

typing(()=>{
let f=flow[i];
add(f[0],f[1]);

if(f[2]=="opt"){
options(["Yeah","Not sure","I'm okay"]);
}else{
i++;setTimeout(step,1000);
}
});
}

function add(t,type){
let d=document.createElement("div");
d.className="msg "+type;
d.innerText=t;
chatBox.appendChild(d);
}

function options(arr){
let div=document.createElement("div");
arr.forEach(o=>{
let b=document.createElement("button");
b.innerText=o;
b.onclick=()=>reply(o,div);
div.appendChild(b);
});
chatBox.appendChild(div);
}

function reply(choice,div){
div.remove();
add(choice,"her");

typing(()=>{
add("I’m here 🤍","me");
add("You matter 💛","me");
add("Always with you 🤍","me");
});
}

/* game */
let score=0;
function goGame(){
chat.classList.add("hidden");
game.classList.remove("hidden");

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="🤍";
h.style.left=Math.random()*100+"vw";

h.onclick=()=>{
score++;
document.getElementById("score").innerText=score;
h.remove();
};

document.body.appendChild(h);
setTimeout(()=>h.remove(),5000);
},700);
}
</script>

</body>
</html>
