<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Didu 💛</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:'Poppins',sans-serif;
overflow:hidden;
background:linear-gradient(135deg,#fbeaff,#e6f0ff);
color:#444;
}

/* slides */
.slide{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
transition:0.7s;
}
.hidden{opacity:0;pointer-events:none}

/* name */
.name{
font-size:30px;
background:linear-gradient(90deg,#ff9de6,#caa6ff,#8fd3ff);
-webkit-background-clip:text;
color:transparent;
cursor:pointer;
}
.name.glow{
text-shadow:0 0 25px #ffb3ec;
}

/* buttons */
button{
padding:12px 20px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#caa6ff,#8fd3ff);
color:white;
margin:8px;
font-size:14px;
}

/* breathing */
.breath{
width:100px;height:100px;
border-radius:50%;
background:radial-gradient(circle,#caa6ff,#8fd3ff);
animation:breathe 5s infinite;
}
@keyframes breathe{
0%{transform:scale(1)}
50%{transform:scale(1.7)}
100%{transform:scale(1)}
}

/* chat */
#chatBox{
width:100%;
max-width:360px;
height:60vh;
background:rgba(255,255,255,0.4);
border-radius:20px;
padding:10px;
overflow:auto;
display:flex;
flex-direction:column;
gap:8px;
}

.msg{
padding:10px;
border-radius:15px;
max-width:75%;
font-size:14px;
}
.me{background:#caa6ff;color:white;align-self:flex-end}
.her{background:white;align-self:flex-start}

/* voice name */
#voiceName{
opacity:0;
transition:1s;
}
#voiceName.show{
opacity:1;
}

/* blur */
.blur-bg{
filter:blur(6px) brightness(0.7);
}

/* overlay */
#focusOverlay{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:rgba(0,0,0,0.3);
color:white;
z-index:999;
}
#focusOverlay.active{display:flex}

/* hearts */
.heart{
position:absolute;
font-size:20px;
animation:float 6s linear infinite;
}
@keyframes float{
0%{transform:translateY(100vh)}
100%{transform:translateY(-10vh)}
}

/* popup */
.popup{
position:absolute;
background:white;
padding:20px;
border-radius:15px;
display:none;
}

/* particles */
.particle{
position:absolute;
width:5px;height:5px;
background:white;
border-radius:50%;
opacity:0.6;
animation:float 8s linear infinite;
}
</style>
</head>

<body>

<!-- particles -->
<script>
setInterval(()=>{
let p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*100+"vw";
document.body.appendChild(p);
setTimeout(()=>p.remove(),8000);
},300);
</script>

<audio id="voice">
<source src="ayush.mp3">
</audio>

<div id="focusOverlay">
<h2>I’m here… just breathe 🤍</h2>
</div>

<!-- S1 -->
<div id="s1" class="slide">
<h1>Hey <span class="name" onclick="glow(this)">Didu 💫</span></h1>
<button onclick="next(1)">Start</button>
</div>

<!-- S2 -->
<div id="s2" class="slide hidden">
<div class="breath"></div>
<p>Breathe slowly 🤍</p>
<button onclick="next(2)">Next</button>
</div>

<!-- S3 -->
<div id="s3" class="slide hidden">
<p>I’m here 🤍</p>
<button onclick="playVoice()">Hear me 🎧</button>
<div id="voiceName">Didu 🤍</div>
<button onclick="openHug()">Hug 🤗</button>
<button onclick="next(3)">Next</button>
<div onclick="secret()" style="opacity:0.2">miss me?</div>
</div>

<!-- CHAT -->
<div id="chat" class="slide hidden">
<div id="chatBox"></div>
<button onclick="goGame()">Next</button>
</div>

<!-- GAME -->
<div id="game" class="slide hidden">
<h2>Tap 🤍</h2>
<p id="score">0</p>
</div>

<!-- HUG -->
<div id="hug" class="slide hidden">
<h2>🤗</h2>
<p>You’re safe… I’m holding you 🤍</p>
<button onclick="back()">Back</button>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
I miss you 🤍<br><br>
<button onclick="closePop()">Close</button>
</div>

<script>
function next(n){
document.getElementById("s"+n).classList.add("hidden");
if(n==3){
chat.classList.remove("hidden");
startChat();
}else{
document.getElementById("s"+(n+1)).classList.remove("hidden");
}
}

function glow(e){e.classList.toggle("glow")}

/* voice */
function playVoice(){
voice.play();
voiceName.classList.add("show");
document.body.classList.add("blur-bg");
focusOverlay.classList.add("active");

voice.onended=()=>{
voiceName.classList.remove("show");
document.body.classList.remove("blur-bg");
focusOverlay.classList.remove("active");
}
}

/* hug */
function openHug(){s3.classList.add("hidden");hug.classList.remove("hidden")}
function back(){hug.classList.add("hidden");s3.classList.remove("hidden")}

/* popup */
function secret(){popup.style.display="block"}
function closePop(){popup.style.display="none"}

/* chat */
let flow=[
["Hey didu 🤍","me"],
["Feeling overwhelmed?","me","opt"]
];
let i=0;

function typing(cb){
let t=document.createElement("div");
t.className="msg her";
t.innerText="typing...";
chatBox.appendChild(t);
setTimeout(()=>{t.remove();cb()},1000);
}

function startChat(){step()}
function step(){
if(i>=flow.length)return;

typing(()=>{
let f=flow[i];
add(f[0],f[1]);

if(f[2]=="opt"){
options(["Yeah","Not sure","I'm okay"]);
}else{
i++;setTimeout(step,1000);
}
});
}

function add(text,type){
let d=document.createElement("div");
d.className="msg "+type;
d.innerText=text;
chatBox.appendChild(d);
chatBox.scrollTop=chatBox.scrollHeight;
}

function options(arr){
let div=document.createElement("div");
arr.forEach(o=>{
let b=document.createElement("button");
b.innerText=o;
b.onclick=()=>reply(o,div);
div.appendChild(b);
});
chatBox.appendChild(div);
}

function reply(choice,div){
div.remove();
add(choice,"her");

typing(()=>{
add("I’m here 🤍","me");
add("You matter more 💛","me");
add("Always with you 🤍","me");
});
}

/* game */
let score=0;
function goGame(){
chat.classList.add("hidden");
game.classList.remove("hidden");

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="🤍";
h.style.left=Math.random()*100+"vw";

h.onclick=()=>{
score++;
document.getElementById("score").innerText=score;
h.remove();
};

document.body.appendChild(h);
setTimeout(()=>h.remove(),5000);
},700);
}
</script>

</body>
</html>
